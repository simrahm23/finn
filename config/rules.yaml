# Materiality: deterministic and editable. Score = base weight + modifiers, clipped to 0-100.
tiers:
  needs_you: 75       # >= 75
  worth_knowing: 40   # 40-74; below 40 = routine (collapsed)

base_weight:
  "M&A": 85
  results: 70             # in-line results are "worth knowing"; surprises below lift them
  management_change: 60    # refined by role below
  fund_raise: 75
  litigation: 60
  pledging: 70
  credit_rating: 45        # refined by action below
  capex: 60
  bonus_split: 45
  insider_trading: 45
  press_release: 40
  dividend: 35
  earnings_call: 30
  investor_meetings: 15
  agm_egm: 15
  postal_ballot: 15
  unclassified: 5

refine:
  management_change:
    top_role: 85           # CEO, MD, CFO, Chairman, whole-time director
    other_role: 45         # independent / non-executive director, company secretary
  credit_rating:
    downgrade: 75
    upgrade: 60
    reaffirm: 25
  earnings_call:
    transcript: 45
  fund_raise:
    debt: 35               # NCDs / commercial paper: routine funding, esp. for lenders         # transcript adds signal; notices and links do not

results:
  pat_yoy_surprise_pct: 20          # |PAT YoY| at or beyond this = a surprise
  surprise_bonus: 10
minor_corporate_action: 40          # subsidiary incorporation, strike-off, letter of comfort, timeline extension
related_filing_cap: 55              # 2nd+ filing about the same results / same person

modifiers:
  price_move_beyond_threshold: 10   # reaction-session |return| beyond threshold; only the top filing per stock-session gets it
  volume_beyond_threshold: 5
  negative_direction: 5             # downgrade, resignation of top role, adverse order
  portfolio_weight_per_pct: 0.5     # +0.5 per % of portfolio weight, max +5

# Defaults for the Rules screen (the browser stores the user's own values).
alert_defaults:
  price_move_pct: 4.0
  volume_multiple: 2.0
  volume_lookback_sessions: 20
  categories: [results, "M&A", management_change, fund_raise, litigation, pledging, credit_rating]
